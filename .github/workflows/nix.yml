name: Nix

on:
  push:
  pull_request:

jobs:
  check-and-build:
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate installer syntax
        run: bash -n install.sh

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Check flake
        run: nix flake check -L

      - name: Build portable profile
        run: nix build -L .#devsetup
